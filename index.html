# index.html

```html
<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Álbum Familiar</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
}

header{
    text-align:center;
    padding:25px;
    background:#000;
}

h1{
    margin:0;
}

#galeria{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:12px;
    padding:15px;
}

#galeria img{
    width:100%;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

#galeria img:hover{
    transform:scale(1.03);
}

</style>

</head>

<body>

<header>

<h1>Álbum Familiar</h1>

<p>Fotografías 2026</p>

</header>

<div id="galeria"></div>

<script>

const fotos=[

"001.jpg",
"002.jpg",
"003.jpg",
"004.jpg",
"005.jpg"

];

const galeria=document.getElementById("galeria");

fotos
.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))
.forEach(nombre=>{

    const img=document.createElement("img");

    img.src="2026/FOTOS/"+nombre;

    img.alt=nombre;

    img.loading="lazy";

    galeria.appendChild(img);

});

</script>

</body>
</html>
```
